<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Username Generator & Scanner</title>
    <style>
        :root {
            --bg: #050a07;
            --surface: #0f1712;
            --border: #166534;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }
        
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Приглушенное зеленое свечение на фоне */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            max-width: 800px;
            max-height: 800px;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.08) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }

        /* Верхняя панель */
        header {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }

        .nav-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:hover {
            background: var(--accent);
            color: #000;
        }

        /* Главный экран */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
        }

        .scanner-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        h1 { margin-top: 0; font-size: 1.5rem; letter-spacing: 1px; }

        .select-platform {
            width: 100%;
            padding: 12px;
            background: #000;
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 20px;
            outline: none;
        }

        .main-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .main-btn:disabled {
            background: var(--surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
            cursor: not-allowed;
        }

        .main-btn:not(:disabled):hover {
            background: var(--accent-hover);
        }

        #result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #000;
            border: 1px solid #333;
            display: none;
        }

        .username-display { font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; }
        .rank-badge { font-weight: bold; padding: 4px 8px; border-radius: 4px; background: #222; }

        /* Модальные окна */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 50;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            max-height: 80vh;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.1);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
            padding: 0;
        }

        .close-btn:hover { color: #fff; }

        .modal-title { margin-top: 0; margin-bottom: 20px; font-size: 1.3rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; }

        /* Настройки (Тумблер) */
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* История */
        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }
        
        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .history-item {
            background: #000;
            border: 1px solid #222;
            border-left: 4px solid var(--accent);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .history-item-left { display: flex; flex-direction: column; gap: 4px; }
        .history-item-right { text-align: right; }
        
        .history-name { font-weight: bold; font-size: 1.1rem; }
        .history-platform { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }
        .history-price { font-size: 0.85rem; color: var(--text-muted); }
        .history-rank { font-weight: bold; }

        .empty-history { text-align: center; color: var(--text-muted); padding: 20px; }
        
        .loader {
            display: none;
            margin: 10px auto;
            border: 3px solid #333;
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <header>
        <button class="nav-btn" onclick="openModal('history-modal')">
            <span>🗂</span> History
        </button>
        <button class="nav-btn" onclick="openModal('settings-modal')">
            <span>⚙</span> Settings
        </button>
    </header>

    <main>
        <div class="scanner-box">
            <h1>USERNAME SCANNER</h1>
            
            <select id="platform-select" class="select-platform">
                <option value="telegram">Telegram (t.me)</option>
                <option value="whatsapp">WhatsApp (wa.me)</option>
            </select>

            <button id="generate-btn" class="main-btn" onclick="manualGenerate()">СГЕНЕРИРОВАТЬ</button>
            <div id="loader" class="loader"></div>

            <div id="result-box">
                <div class="username-display" id="res-username">-</div>
                <div style="margin-bottom: 10px;">
                    <span id="res-rank" class="rank-badge">-</span>
                </div>
                <div id="res-status" style="font-size: 0.9rem;">-</div>
            </div>
        </div>
    </main>

    <!-- Модальное окно Настроек -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('settings-modal')">✕</button>
            <h2 class="modal-title">Настройки</h2>
            
            <div class="setting-row">
                <div>
                    <strong>Автопоиск (Фоновый сканер)</strong>
                    <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Ищет непрерывно с задержкой 2.5с.</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="auto-search-toggle" onchange="toggleAutoSearch(this)">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <!-- Модальное окно Истории -->
    <div id="history-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('history-modal')">✕</button>
            <h2 class="modal-title">История улова</h2>
            
            <div id="history-container" class="history-list">
                <!-- Сюда добавляются пойманные ники -->
            </div>
        </div>
    </div>

    <script>
        // --- СОСТОЯНИЕ И НАСТРОЙКИ ---
        let isAutoSearching = false;
        let isFetching = false;
        let historyData = JSON.parse(localStorage.getItem('catch_history')) || [];
        
        // Веса рангов для правильной сортировки (от дорогих к дешевым)
        const rankWeights = {
            "SSS+": 100,
            "SS": 80,
            "S": 60,
            "A": 40,
            "B": 20,
            "ERR": -1,
            "F": -10
        };

        // --- УПРАВЛЕНИЕ МОДАЛЬНЫМИ ОКНАМИ ---
        function openModal(id) {
            document.getElementById(id).classList.add('active');
            if(id === 'history-modal') renderHistory();
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // --- ЛОГИКА АВТОПОИСКА ---
        function toggleAutoSearch(checkbox) {
            isAutoSearching = checkbox.checked;
            const btn = document.getElementById('generate-btn');
            
            if (isAutoSearching) {
                btn.disabled = true;
                btn.textContent = "АВТОПОИСК АКТИВЕН...";
                runAutoSearchCycle();
            } else {
                btn.disabled = false;
                btn.textContent = "СГЕНЕРИРОВАТЬ";
                document.getElementById('loader').style.display = 'none';
            }
        }

        async function runAutoSearchCycle() {
            if (!isAutoSearching) return;
            
            if (!isFetching) {
                await fetchAndProcessUsername();
            }
            
            // Задержка 2.5 секунды для защиты от блокировок
            if (isAutoSearching) {
                setTimeout(runAutoSearchCycle, 2500);
            }
        }

        // --- ЛОГИКА РУЧНОГО ПОИСКА ---
        async function manualGenerate() {
            if (isFetching || isAutoSearching) return;
            const btn = document.getElementById('generate-btn');
            btn.disabled = true;
            await fetchAndProcessUsername();
            btn.disabled = false;
        }

        // --- ОСНОВНАЯ ФУНКЦИЯ ЗАПРОСА ---
        async function fetchAndProcessUsername() {
            isFetching = true;
            const platform = document.getElementById('platform-select').value;
            const resBox = document.getElementById('result-box');
            const loader = document.getElementById('loader');
            
            loader.style.display = 'block';
            
            try {
                const response = await fetch(`/api/generate?platform=${platform}`);
                const data = await response.json();
                
                // Обновление интерфейса
                resBox.style.display = 'block';
                document.getElementById('res-username').textContent = `@${data.generated_username}`;
                document.getElementById('res-username').style.color = data.evaluation.color;
                
                const rankEl = document.getElementById('res-rank');
                rankEl.textContent = data.evaluation.rank;
                rankEl.style.color = data.evaluation.color;
                
                document.getElementById('res-status').textContent = data.evaluation.status;
                document.getElementById('res-status').style.color = data.evaluation.color;

                // Сохранение в историю, если свободен и не является ошибкой лимита
                if (data.is_free === true && data.evaluation.rank !== "ERR") {
                    addToHistory({
                        username: data.generated_username,
                        platform: platform,
                        rank: data.evaluation.rank,
                        price: data.evaluation.status,
                        color: data.evaluation.color
                    });
                }
            } catch (err) {
                console.error("Ошибка запроса:", err);
            } finally {
                loader.style.display = 'none';
                isFetching = false;
            }
        }

        // --- ЛОГИКА ИСТОРИИ ---
        function addToHistory(item) {
            // Проверка на дубликаты
            if (historyData.some(i => i.username === item.username && i.platform === item.platform)) {
                return;
            }
            
            historyData.push(item);
            
            // Сортировка по убыванию веса ранга
            historyData.sort((a, b) => {
                const weightA = rankWeights[a.rank] || 0;
                const weightB = rankWeights[b.rank] || 0;
                return weightB - weightA;
            });
            
            // Сохранение в память браузера
            localStorage.setItem('catch_history', JSON.stringify(historyData));
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            container.innerHTML = '';
            
            if (historyData.length === 0) {
                container.innerHTML = '<div class="empty-history">История пуста.<br>Найденные свободные юзернеймы появятся здесь.</div>';
                return;
            }
            
            historyData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.style.borderLeftColor = item.color;
                
                div.innerHTML = `
                    <div class="history-item-left">
                        <div class="history-name" style="color: ${item.color}">@${item.username}</div>
                        <div class="history-platform">${item.platform}</div>
                    </div>
                    <div class="history-item-right">
                        <div class="history-rank" style="color: ${item.color}">${item.rank}</div>
                        <div class="history-price">${item.price}</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
