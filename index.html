<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Username Scanner</title>
    <style>
        :root {
            --bg-app: #060a08;
            --bg-card: #141A17;
            --bg-card-hover: #1A221E;
            --primary: #29c75f;
            --primary-hover: #22a94f;
            --text-main: #ffffff;
            --text-muted: #829288;
            --border-color: #1E2822;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* --- 1. ФОН: ЛИСТОЧКИ --- */
        .leaf-pattern {
            position: fixed;
            inset: 0;
            /* Встроенный SVG паттерн листочков, как в VPN */
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M40 15C40 15 55 25 55 40C55 55 40 65 40 65C40 65 25 55 25 40C25 25 40 15 40 15Z' fill='none' stroke='%2329c75f' stroke-width='1' stroke-opacity='0.05'/%3E%3Cpath d='M40 15L40 65' fill='none' stroke='%2329c75f' stroke-width='1' stroke-opacity='0.05'/%3E%3Cpath d='M40 40L50 32' fill='none' stroke='%2329c75f' stroke-width='1' stroke-opacity='0.05'/%3E%3Cpath d='M40 40L30 32' fill='none' stroke='%2329c75f' stroke-width='1' stroke-opacity='0.05'/%3E%3C/svg%3E");
            background-size: 140px 140px;
            z-index: -20;
            pointer-events: none;
        }

        /* --- 2. ФОН: КРУТЯЩИЙСЯ ТЕМНЫЙ ДЫМ --- */
        .smoke-container {
            position: fixed;
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            z-index: -15;
            pointer-events: none; /* ЖИЗНЕННО ВАЖНО: пропускает клики */
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spinSmoke 45s linear infinite;
        }

        .smoke {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            mix-blend-mode: screen;
        }

        .smoke-1 { width: 70vw; height: 70vw; background: rgba(41, 199, 95, 0.15); transform: translate(-20%, -30%); animation: pulseSmoke 10s infinite alternate ease-in-out; }
        .smoke-2 { width: 80vw; height: 60vw; background: rgba(22, 163, 74, 0.12); transform: translate(30%, 20%); animation: pulseSmoke 15s infinite alternate-reverse ease-in-out; }
        .smoke-3 { width: 65vw; height: 80vw; background: rgba(5, 150, 105, 0.15); transform: translate(10%, -40%); animation: pulseSmoke 20s infinite alternate ease-in-out; }

        @keyframes spinSmoke { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulseSmoke { 0% { opacity: 0.5; transform: scale(0.9); } 100% { opacity: 0.9; transform: scale(1.1) translate(5%, 5%); } }

        /* --- НАВИГАЦИЯ --- */
        header {
            display: flex;
            justify-content: space-between;
            padding: 20px 24px;
            z-index: 50; /* Поднято над фоном */
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .nav-btn:hover { color: var(--primary); }
        .nav-icon { font-size: 1.2rem; }

        /* --- ГЛАВНЫЙ ЭКРАН --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
            position: relative;
            transform: translateY(-8vh);
        }

        .app-container {
            width: 100%;
            max-width: 320px; /* Сжато с боков для аккуратности */
            display: flex;
            flex-direction: column;
            gap: 12px; /* Уменьшил отступы между блоками (поджато) */
        }

        /* Переключатель платформ */
        .platform-toggle {
            display: flex;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--border-color);
        }

        .platform-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .platform-btn.active {
            background: rgba(41, 199, 95, 0.1);
            color: var(--primary);
        }

        /* Индикатор автопарсера */
        .auto-indicator {
            display: none;
            text-align: center;
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: 500;
            animation: pulseText 1.5s infinite alternate;
            margin: 4px 0;
        }
        @keyframes pulseText { 0% { opacity: 0.5; } 100% { opacity: 1; text-shadow: 0 0 8px rgba(41, 199, 95, 0.6); } }

        /* Центральное поле вывода */
        .result-field {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .result-field:hover {
            border-color: rgba(41, 199, 95, 0.6);
            box-shadow: 0 10px 30px rgba(41, 199, 95, 0.15);
        }

        .auto-glow-effect {
            border-color: var(--primary) !important;
            animation: autoPulseBox 1.5s infinite alternate;
        }
        @keyframes autoPulseBox { 0% { box-shadow: 0 0 10px rgba(41, 199, 95, 0.1); } 100% { box-shadow: 0 0 25px rgba(41, 199, 95, 0.4); } }

        .username-text {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: var(--text-muted);
            word-break: break-all;
        }

        .rank-badge {
            font-size: 0.85rem;
            font-weight: 700;
            padding: 4px 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            margin-bottom: 6px;
            display: none;
        }

        .price-text {
            font-size: 0.85rem;
            opacity: 0.7;
        }

        /* Кнопка генерации */
        .btn-generate {
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-generate:active { transform: scale(0.97); }
        .btn-generate:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-generate:disabled { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border-color); cursor: not-allowed; }

        /* --- МОДАЛЬНЫЕ ОКНА (ЖЕСТКИЙ ФИКС КЛИКОВ) --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(6, 10, 8, 0.95);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            
            /* ЖЕСТКАЯ БЛОКИРОВКА НЕВИДИМЫХ СЛОЕВ */
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto; /* Включаем клики только когда открыто */
        }

        .modal-content {
            background: var(--bg-app);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 360px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .modal-header { padding: 18px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .modal-title { margin: 0; font-size: 1.15rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        
        .btn-close {
            background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted);
            width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .btn-close:hover { color: #fff; background: var(--border-color); }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }

        /* Настройки (Тумблеры и Фильтры) */
        .setting-item { background: var(--bg-card); padding: 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); margin-bottom: 12px; }
        .setting-info { display: flex; flex-direction: column; gap: 4px; }
        .setting-title { font-weight: 600; font-size: 0.95rem; }
        .setting-desc { font-size: 0.75rem; color: var(--text-muted); line-height: 1.2; }

        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #1a221e; border: 1px solid var(--border-color); border-radius: 34px; transition: .3s; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: var(--text-muted); border-radius: 50%; transition: .3s; }
        
        input:checked + .slider { background-color: rgba(41, 199, 95, 0.15); border-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); background-color: var(--primary); }

        .filter-options { display: none; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; margin-top: -6px; margin-bottom: 12px; }
        .filter-options.active { display: block; }
        .filter-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .filter-row:last-child { margin-bottom: 0; }
        select { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px; border-radius: 6px; outline: none; font-family: inherit; font-size: 0.85rem;}

        /* История */
        .history-list { display: flex; flex-direction: column; gap: 10px; }
        .history-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; }
        .history-card:hover { border-color: var(--primary); background: var(--bg-card-hover); }
        .hist-left { display: flex; flex-direction: column; gap: 4px; }
        .hist-right { text-align: right; }
        .hist-user { font-size: 1.05rem; font-weight: 700; }
        .hist-plat { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .hist-rank { font-weight: 700; font-size: 0.85rem; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 0.9rem; }

        .toast { position: absolute; inset: 0; background: var(--primary); color: #000; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-weight: 700; font-size: 0.95rem; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 5; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <!-- 1. ФОН: ЛИСТОЧКИ -->
    <div class="leaf-pattern"></div>

    <!-- 2. ФОН: ДЫМ/СИЯНИЕ -->
    <div class="smoke-container">
        <div class="smoke smoke-1"></div>
        <div class="smoke smoke-2"></div>
        <div class="smoke smoke-3"></div>
    </div>

    <!-- Шапка -->
    <header>
        <button class="nav-btn" onclick="openModal('modal-history')">
            <span class="nav-icon">📁</span> История
        </button>
        <button class="nav-btn" onclick="openModal('modal-settings')">
            <span class="nav-icon">⚙️</span> Настройки
        </button>
    </header>

    <!-- Основной контент -->
    <main>
        <div class="app-container">
            
            <div class="platform-toggle">
                <button class="platform-btn active" onclick="setPlatform('telegram', this)">Telegram</button>
                <button class="platform-btn" onclick="setPlatform('whatsapp', this)">WhatsApp</button>
            </div>

            <div id="auto-indicator" class="auto-indicator">Автопарсер активен...</div>

            <div class="result-field" id="result-box">
                <div class="username-text" id="res-username">@username</div>
                <div class="rank-badge" id="res-rank" style="color: var(--text-muted); display: none;">-</div>
                <div class="price-text" id="res-status" style="color: var(--text-muted);">Нажмите сгенерировать</div>
            </div>

            <button class="btn-generate" id="btn-generate" onclick="manualGenerate()">Сгенерировать</button>
            
        </div>
    </main>

    <!-- Модалка: Настройки -->
    <div class="modal-overlay" id="modal-settings">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title"><span class="nav-icon">⚙️</span> Настройки</h2>
                <button class="btn-close" onclick="closeModal('modal-settings')">✕</button>
            </div>
            <div class="modal-body">
                
                <div class="setting-item">
                    <div class="setting-info">
                        <span class="setting-title">Автопарсер</span>
                        <span class="setting-desc">Фоновый перебор никнеймов</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle-auto" onchange="toggleAutoSearch(this)">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setting-item">
                    <div class="setting-info">
                        <span class="setting-title">Смарт-фильтр</span>
                        <span class="setting-desc">Генерация коротких ников (2000+)</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle-filter" onchange="toggleFilterMenu(this)">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="filter-options" id="filter-menu">
                    <div class="filter-row">
                        <span style="font-size: 0.85rem; color: var(--text-main);">Длина слова</span>
                        <select id="filter-len">
                            <option value="5-6">5-6 символов</option>
                            <option value="7-8">7-8 символов</option>
                        </select>
                    </div>
                    <div class="filter-row">
                        <span style="font-size: 0.85rem; color: var(--text-main);">Добавить цифры</span>
                        <label class="switch"><input type="checkbox" id="filter-num"><span class="slider"></span></label>
                    </div>
                    <div class="filter-row">
                        <span style="font-size: 0.85rem; color: var(--text-main);">Разрешить "_"</span>
                        <label class="switch"><input type="checkbox" id="filter-und"><span class="slider"></span></label>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Модалка: История -->
    <div class="modal-overlay" id="modal-history">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title"><span class="nav-icon">📁</span> История улова</h2>
                <button class="btn-close" onclick="closeModal('modal-history')">✕</button>
            </div>
            <div class="modal-body">
                <div class="history-list" id="history-container">
                    <!-- Данные JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPlatform = 'telegram';
        let isAuto = false;
        let isFetching = false;
        let historyData = JSON.parse(localStorage.getItem('vpn_parser_history')) || [];
        
        const weights = { "SSS+": 100, "SS": 80, "S": 60, "A": 40, "B": 20, "ERR": -1, "F": -10 };

        function setPlatform(platform, btn) {
            if (isAuto) return; 
            currentPlatform = platform;
            document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function openModal(id) {
            const modal = document.getElementById(id);
            modal.classList.add('active');
            if(id === 'modal-history') renderHistory();
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('active');
        }

        function toggleFilterMenu(cb) {
            const menu = document.getElementById('filter-menu');
            if (cb.checked) {
                menu.classList.add('active');
            } else {
                menu.classList.remove('active');
            }
        }

        function toggleAutoSearch(cb) {
            isAuto = cb.checked;
            const btn = document.getElementById('btn-generate');
            const ind = document.getElementById('auto-indicator');
            const box = document.getElementById('result-box');
            
            if (isAuto) {
                btn.disabled = true;
                btn.textContent = "Поиск...";
                ind.style.display = 'block';
                box.classList.add('auto-glow-effect');
                runCycle();
            } else {
                btn.disabled = false;
                btn.textContent = "Сгенерировать";
                ind.style.display = 'none';
                box.classList.remove('auto-glow-effect');
            }
        }

        async function runCycle() {
            if (!isAuto) return;
            if (!isFetching) await fetchUsername();
            if (isAuto) setTimeout(runCycle, 2200);
        }

        async function manualGenerate() {
            if (isFetching || isAuto) return;
            const btn = document.getElementById('btn-generate');
            btn.disabled = true;
            btn.textContent = "Генерация...";
            await fetchUsername();
            btn.textContent = "Сгенерировать";
            btn.disabled = false;
        }

        async function fetchUsername() {
            isFetching = true;
            
            const useFilter = document.getElementById('toggle-filter').checked;
            const lenMode = document.getElementById('filter-len').value;
            const useNum = document.getElementById('filter-num').checked;
            const useUnd = document.getElementById('filter-und').checked;

            const url = `/api/generate?platform=${currentPlatform}&use_filter=${useFilter}&len_mode=${lenMode}&use_num=${useNum}&use_und=${useUnd}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                const uEl = document.getElementById('res-username');
                const rEl = document.getElementById('res-rank');
                const sEl = document.getElementById('res-status');

                uEl.textContent = `@${data.generated_username}`;
                uEl.style.color = data.evaluation.color;
                
                rEl.style.display = 'inline-block';
                rEl.textContent = data.evaluation.rank;
                rEl.style.color = data.evaluation.color;
                
                sEl.textContent = data.evaluation.status;
                sEl.style.color = data.evaluation.color;

                if (data.is_free === true && data.evaluation.rank !== "ERR") {
                    saveToHistory({
                        user: data.generated_username,
                        plat: currentPlatform,
                        rank: data.evaluation.rank,
                        price: data.evaluation.status,
                        color: data.evaluation.color
                    });
                }
            } catch (e) {
                console.log(e);
            } finally {
                isFetching = false;
            }
        }

        function saveToHistory(item) {
            if (historyData.some(i => i.user === item.user && i.plat === item.plat)) return;
            historyData.push(item);
            historyData.sort((a, b) => (weights[b.rank] || 0) - (weights[a.rank] || 0));
            localStorage.setItem('vpn_parser_history', JSON.stringify(historyData));
        }

        function copyText(text, cardElement) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = cardElement.querySelector('.toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1200);
            });
        }

        function renderHistory() {
            const cont = document.getElementById('history-container');
            cont.innerHTML = '';
            
            if (historyData.length === 0) {
                cont.innerHTML = '<div class="empty-state">История пуста.<br>Найденные ники сохранятся здесь навсегда.</div>';
                return;
            }
            
            historyData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-card';
                div.onclick = () => copyText(item.user, div);
                
                div.innerHTML = `
                    <div class="hist-left">
                        <div class="hist-user" style="color: ${item.color}">@${item.user}</div>
                        <div class="hist-plat">${item.plat}</div>
                    </div>
                    <div class="hist-right">
                        <div class="hist-rank" style="color: ${item.color}">${item.rank}</div>
                        <div class="price-text" style="color: var(--text-muted)">${item.price}</div>
                    </div>
                    <div class="toast">Скопировано!</div>
                `;
                cont.appendChild(div);
            });
        }
    </script>
</body>
</html>
