<!DOCTYPE html> 
<html lang="ru"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
    <title>Multi-Platform Username Catch</title> 
    <style> 
        :root { 
            --bg-dark: #0a0c0a; 
            --card-bg: #111412; 
            --neon-green-muted: rgba(43, 207, 102, 0.4); 
            --neon-green-bright: #2bcf66; 
            --text-main: #ffffff; 
            --text-sub: #7a8a80; 
        } 
 
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            overflow: hidden; 
            position: relative; 
        } 
 
        .leaf { 
            position: absolute; 
            opacity: 0.05; 
            fill: var(--neon-green-bright); 
            z-index: 0; 
        } 
        .leaf-1 { top: 10%; left: 10%; width: 120px; transform: rotate(45deg); } 
        .leaf-2 { bottom: 15%; right: 5%; width: 180px; transform: rotate(-30deg); } 
 
        .container { 
            position: relative; 
            z-index: 1; 
            width: 100%; 
            max-width: 360px; 
            padding: 20px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        } 

        /* Выбор платформы */
        .platform-selector {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--neon-green-muted);
            border-radius: 14px;
            padding: 4px;
            width: 100%;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .platform-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-sub);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .platform-tab.active {
            background: var(--neon-green-bright);
            color: var(--bg-dark);
        }
 
        .result-box { 
            background-color: var(--card-bg); 
            border: 1px solid var(--neon-green-muted); 
            border-radius: 20px; 
            padding: 25px 20px; 
            width: 100%; 
            text-align: center; 
            box-shadow: 0 0 25px rgba(43, 207, 102, 0.1), inset 0 0 15px rgba(43, 207, 102, 0.05); 
            margin-bottom: 25px; 
            transition: all 0.3s ease; 
            box-sizing: border-box; 
        } 
 
        .username-display { 
            font-size: 24px; 
            font-weight: 700; 
            color: var(--neon-green-bright); 
            letter-spacing: 1px; 
            text-shadow: 0 0 10px rgba(43, 207, 102, 0.3); 
            transition: opacity 0.2s ease; 
            word-break: break-all; 
            margin-bottom: 10px;
        } 

        .rank-badge {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            letter-spacing: 0.5px;
        }
 
        .generate-btn { 
            background-color: var(--neon-green-bright); 
            color: var(--bg-dark); 
            border: none; 
            border-radius: 14px; 
            padding: 16px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(43, 207, 102, 0.2); 
            transition: all 0.2s ease; 
            margin-bottom: 20px; 
            -webkit-tap-highlight-color: transparent; 
        } 
 
        .generate-btn:active { 
            transform: scale(0.96); 
            background-color: #24b056; 
        } 

        .open-btn {
            color: var(--neon-green-bright);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }
    </style> 
</head> 
<body> 
 
    <svg class="leaf leaf-1" viewBox="0 0 24 24"><path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A4.49 4.49 0 0 0 8 20C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75C7 8 17 8 17 8z"/></svg> 
    <svg class="leaf leaf-2" viewBox="0 0 24 24"><path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A4.49 4.49 0 0 0 8 20C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75C7 8 17 8 17 8z"/></svg> 
 
    <div class="container"> 
        <!-- Переключатель платформы -->
        <div class="platform-selector">
            <div id="tabTg" class="platform-tab active" onclick="selectPlatform('telegram')">Telegram</div>
            <div id="tabWa" class="platform-tab" onclick="selectPlatform('whatsapp')">WhatsApp</div>
        </div>

        <div class="result-box"> 
            <div class="username-display" id="usernameDisplay">Выбери сервис</div> 
            <div class="rank-badge" id="rankBadge">Оценка: -</div>
        </div> 
         
        <button class="generate-btn" id="generateBtn">Сгенерировать</button> 
        <a id="openLink" href="#" target="_blank" class="open-btn">Открыть профиль ↗</a>
    </div> 
 
    <script> 
        let currentPlatform = "telegram";
        const display = document.getElementById("usernameDisplay"); 
        const rankBadge = document.getElementById("rankBadge"); 
        const btn = document.getElementById("generateBtn"); 
        const openLink = document.getElementById("openLink");

        function selectPlatform(p) {
            currentPlatform = p;
            document.getElementById("tabTg").classList.toggle("active", p === "telegram");
            document.getElementById("tabWa").classList.toggle("active", p === "whatsapp");
            display.innerText = "@выбран_" + p;
            rankBadge.innerText = "Оценка: -";
            openLink.style.display = "none";
        }
 
        btn.addEventListener("click", async () => { 
            btn.disabled = true; 
            display.style.opacity = "0.5"; 
            display.innerText = "Поиск..."; 
            rankBadge.innerText = currentPlatform === "telegram" ? "Двойная проверка (t.me + Fragment)..." : "Формирование...";
            rankBadge.style.color = "var(--text-sub)";

            try { 
                const response = await fetch(`/api/generate?platform=${currentPlatform}`); 
                const data = await response.json(); 
 
                display.innerText = "@" + data.generated_username; 
                
                if (data.evaluation) {
                    rankBadge.innerText = `[${data.evaluation.rank}] ${data.evaluation.status}`;
                    rankBadge.style.color = data.evaluation.color;
                }

                openLink.href = data.link;
                openLink.style.display = "inline-block";
            } catch (e) { 
                console.error("Ошибка:", e); 
                display.innerText = "Ошибка сервера";
            } 
             
            display.style.opacity = "1"; 
            btn.disabled = false; 
        }); 
    </script> 
</body> 
</html>
