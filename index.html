<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Username Generator & Checker</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .username {
            font-size: 26px;
            font-weight: bold;
            margin: 16px 0;
            color: #38bdf8;
            word-break: break-all;
        }
        .badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .link-btn {
            display: inline-block;
            margin-top: 16px;
            color: #38bdf8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>TG Username Catch</h2>
    <div id="username" class="username">@нажми_кнопку</div>
    <div id="badge" class="badge" style="color: #94a3b8;">Ранг: -</div>
    <button class="btn" onclick="generate()">🎲 Сгенерировать</button>
    <br>
    <a id="tgLink" href="#" target="_blank" class="link-btn" style="display:none;">Открыть профиль в Telegram ↗</a>
</div>

<script>
async function generate() {
    const unEl = document.getElementById('username');
    const badgeEl = document.getElementById('badge');
    const linkEl = document.getElementById('tgLink');
    
    unEl.innerText = "Проверка...";
    badgeEl.innerText = "Запрос к Fragment...";
    badgeEl.style.color = "#94a3b8";
    badgeEl.style.borderColor = "rgba(255, 255, 255, 0.1)";
    
    try {
        const res = await fetch('/api/generate');
        const data = await res.json();
        
        unEl.innerText = "@" + data.generated_username;
        
        if (data.evaluation) {
            badgeEl.innerText = `[${data.evaluation.rank}] ${data.evaluation.status}`;
            badgeEl.style.color = data.evaluation.color;
            badgeEl.style.borderColor = data.evaluation.color;
        }
        
        linkEl.href = data.tg_link;
        linkEl.style.display = "inline-block";
    } catch (e) {
        unEl.innerText = "Ошибка сервера";
    }
}
</script>

</body>
</html>
