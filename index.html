<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NameHunter PRO</title>
    <style>
        :root {
            --bg-color: #0d130e;
            --card-bg: #141f17;
            --accent-green: #29c75f;
            --accent-glow: rgba(41, 199, 95, 0.25);
            --text-main: #e2e8f0;
            --text-muted: #8b9b8e;
            --border-color: rgba(41, 199, 95, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            color: var(--accent-green);
            margin: 0;
            text-shadow: 0 0 12px var(--accent-glow);
        }

        .header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .btn-primary {
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-autoparse {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #0284c7;
        }

        .btn-autoparse.active {
            background: #ef4444;
            color: #fff;
            border: 1px solid #dc2626;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .result-box {
            display: none;
            text-align: center;
            padding: 16px;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            margin-top: 12px;
            border: 1px solid var(--border-color);
        }

        .username-title {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 6px;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .btn-clear {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        /* КАРТОЧКА СВАЙПА */
        .history-wrapper {
            position: relative;
            margin-bottom: 8px;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(239, 68, 68, 0.2); /* Красный подслой при свайпе */
            transition: max-height 0.3s ease, margin-bottom 0.3s ease, opacity 0.3s ease;
            max-height: 70px;
        }

        .history-wrapper.deleting {
            max-height: 0;
            margin-bottom: 0;
            opacity: 0;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #141f17;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            font-size: 14px;
            position: relative;
            z-index: 2;
            touch-action: pan-y;
            will-change: transform;
            user-select: none;
        }

        /* МОДАЛЬНОЕ ОКНО */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-card {
            background: #121814;
            border: 1px solid var(--accent-green);
            border-radius: 16px;
            padding: 20px;
            width: 85%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 0 25px var(--accent-glow);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎯 NameHunter PRO</h1>
        <p>Поиск и отслеживание редких юзернеймов</p>
    </div>

    <div class="card">
        <button class="btn btn-primary" onclick="generateOne()">Сгенерировать ник 🎲</button>
        <button id="autoParseBtn" class="btn btn-autoparse" onclick="toggleAutoParse()">Запустить автопарс 🚀</button>

        <div id="resultBox" class="result-box">
            <div id="resUsername" class="username-title">@username</div>
            <div>
                <span id="resRank" class="badge">S</span>
                <span id="resStatus" style="font-size: 13px; color: var(--text-muted);">Проверка...</span>
            </div>
        </div>
    </div>

    <div class="history-header">
        <h3 style="margin: 0; font-size: 16px;">История вылова</h3>
        <button class="btn-clear" onclick="clearHistory()">🗑 Очистить</button>
    </div>

    <div id="historyList"></div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ИТОГОВ АВТОПАРСА -->
<div id="summaryModal" class="modal-overlay">
    <div class="modal-card">
        <h3 style="color: var(--accent-green); margin-top:0;">🎯 Итоги Автопарса</h3>
        <p style="font-size:13px; color:#aaa; margin-bottom: 12px;">Выловлено свободных: <b id="modalCount">0</b></p>
        <div id="modalList" style="text-align:left; max-height:200px; overflow-y:auto; margin-bottom: 15px;"></div>
        <button class="btn btn-primary" onclick="closeModal()">Отлично</button>
    </div>
</div>

<script>
    let isAutoParsing = false;
    let autoParseCatches = [];
    let localHistory = JSON.parse(localStorage.getItem('vh_history') || '[]');

    renderHistory();

    async function generateOne() {
        const resBox = document.getElementById('resultBox');
        resBox.style.display = 'block';
        document.getElementById('resUsername').innerText = "Поиск...";
        
        try {
            const res = await fetch('/api/generate?use_filter=true&len_mode=5-6');
            const data = await res.json();
            
            if(data.status === 'success') {
                displayResult(data);
                saveToHistory(data);
            } else {
                document.getElementById('resUsername').innerText = "Ошибка лимита";
            }
        } catch(e) {
            document.getElementById('resUsername').innerText = "Ошибка сети";
        }
    }

    function displayResult(data) {
        document.getElementById('resUsername').innerText = "@" + data.generated_username;
        const rankEl = document.getElementById('resRank');
        rankEl.innerText = data.evaluation.rank;
        rankEl.style.backgroundColor = data.evaluation.color;
        rankEl.style.color = "#000";
        document.getElementById('resStatus').innerText = data.evaluation.status;
    }

    async function toggleAutoParse() {
        const btn = document.getElementById('autoParseBtn');
        if (!isAutoParsing) {
            isAutoParsing = true;
            autoParseCatches = [];
            btn.innerText = "Остановить автопарс 🛑";
            btn.classList.add('active');
            runAutoParse();
        } else {
            isAutoParsing = false;
            btn.innerText = "Запустить автопарс 🚀";
            btn.classList.remove('active');
            showSummary();
        }
    }

    async function runAutoParse() {
        while (isAutoParsing) {
            try {
                const res = await fetch('/api/generate?use_filter=true&len_mode=5-6');
                const data = await res.json();
                
                if (data.status === 'success' && data.is_free) {
                    autoParseCatches.push(data);
                    saveToHistory(data);
                    displayResult(data);
                }
            } catch (e) {
                console.error(e);
            }
            await new Promise(r => setTimeout(r, 1200));
        }
    }

    function showSummary() {
        if (autoParseCatches.length === 0) {
            alert("За время автопарса свободных ников не найдено.");
            return;
        }

        const sorted = [...autoParseCatches].sort((a,b) => b.evaluation.score - a.evaluation.score);
        const top = sorted.slice(0, 5);

        document.getElementById('modalCount').innerText = autoParseCatches.length;
        const listHtml = top.map(item => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px; background:rgba(255,255,255,0.05); border-radius:8px; margin-bottom:6px;">
                <span style="font-weight:bold; color:#fff;">@${item.generated_username}</span>
                <span style="color:${item.evaluation.color}; font-weight:bold; font-size:12px;">${item.evaluation.rank}</span>
            </div>
        `).join('');

        document.getElementById('modalList').innerHTML = listHtml;
        document.getElementById('summaryModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('summaryModal').style.display = 'none';
    }

    function saveToHistory(item) {
        localHistory.unshift(item);
        if (localHistory.length > 30) localHistory.pop();
        localStorage.setItem('vh_history', JSON.stringify(localHistory));
        renderHistory();
    }

    function renderHistory() {
        const container = document.getElementById('historyList');
        if (localHistory.length === 0) {
            container.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:13px; padding:15px;">История пуста</div>`;
            return;
        }

        container.innerHTML = localHistory.map((item, index) => `
            <div class="history-wrapper" id="wrapper-${index}">
                <div class="history-item" 
                     data-index="${index}"
                     ontouchstart="handleTouchStart(event)" 
                     ontouchmove="handleTouchMove(event)" 
                     ontouchend="handleTouchEnd(event)">
                    <span style="font-weight:bold; color:#fff;">@${item.generated_username}</span>
                    <div>
                        <span style="color:${item.evaluation.color}; font-weight:bold; margin-right:8px;">${item.evaluation.rank}</span>
                        <span style="color:${item.is_free ? '#29c75f' : '#ef4444'}; font-size:12px;">${item.is_free ? 'Свободен' : 'Занят'}</span>
                    </div>
                </div>
            </div>
        `).join('');
    }

    /* МЕХАНИКА СВАЙПА ВПРАВО ДЛЯ УДАЛЕНИЯ */
    let startX = 0;
    let currentX = 0;
    let activeItem = null;

    function handleTouchStart(e) {
        startX = e.touches[0].clientX;
        activeItem = e.currentTarget;
        activeItem.style.transition = 'none';
    }

    function handleTouchMove(e) {
        if (!activeItem) return;
        currentX = e.touches[0].clientX;
        let diffX = currentX - startX;

        // Позволяем свайпать только ВПРАВО (diffX > 0)
        if (diffX > 0) {
            activeItem.style.transform = `translateX(${diffX}px)`;
            activeItem.style.opacity = `${1 - diffX / 250}`;
        }
    }

    function handleTouchEnd(e) {
        if (!activeItem) return;
        let diffX = currentX - startX;
        const index = parseInt(activeItem.getAttribute('data-index'));
        const wrapper = document.getElementById(`wrapper-${index}`);

        // Если свайпнули вправо более чем на 140 пикселей (полный свайп)
        if (diffX > 140) {
            // Анимация вылета карточки вправо
            activeItem.style.transition = 'transform 0.25s ease-out, opacity 0.25s ease-out';
            activeItem.style.transform = 'translateX(100%)';
            activeItem.style.opacity = '0';

            // Плавное схлопывание высоты блока
            setTimeout(() => {
                if (wrapper) wrapper.classList.add('deleting');
            }, 150);

            // Удаление из данных через 0.4 секунды после окончания анимаций
            setTimeout(() => {
                localHistory.splice(index, 1);
                localStorage.setItem('vh_history', JSON.stringify(localHistory));
                renderHistory();
            }, 400);

        } else {
            // Если свайп не доведен до конца — возвращаем карточку на место
            activeItem.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
            activeItem.style.transform = 'translateX(0px)';
            activeItem.style.opacity = '1';
        }

        startX = 0;
        currentX = 0;
        activeItem = null;
    }

    function clearHistory() {
        if (confirm("Очистить всю историю проверок?")) {
            localHistory = [];
            localStorage.removeItem('vh_history');
            renderHistory();
        }
    }
</script>
</body>
</html>
