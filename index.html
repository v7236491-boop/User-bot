<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NameHunter PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --primary: #29c75f; --bg: #060b08; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin:0; }
        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:999; display:none; align-items:center; justify-content:center; }
        .acc-head { padding:15px; border-bottom:1px solid #222; display:flex; justify-content:space-between; cursor:pointer; }
        .acc-arrow { width:6px; height:6px; border-right:2px solid #666; border-bottom:2px solid #666; transform:rotate(45deg); transition:0.3s; }
        .acc-head.open .acc-arrow { transform:rotate(-135deg); border-color:var(--primary); }
        .acc-body { display:none; padding:15px; background:rgba(255,255,255,0.03); }
        .acc-head.open + .acc-body { display:block; }
        .shop-card { background:rgba(255,255,255,0.05); padding:10px; border-radius:10px; margin-bottom:10px; display:flex; justify-content:space-between; }
        #tycoon-overlay { position:fixed; inset:0; background:radial-gradient(circle, #1a2a1a, #010306); display:none; flex-direction:column; align-items:center; justify-content:space-around; z-index:2000; }
    </style>
</head>
<body>
    <header style="padding:20px; display:flex; justify-content:space-between;">
        <button onclick="openModal('modal-pro')" class="btn-pro">👑 PRO</button>
        <div onclick="openModal('modal-settings')">⚙️</div>
    </header>

    <div id="modal-offline" class="modal" style="display:none; align-items:center;">
        <div style="background:#111; padding:20px; border-radius:20px; text-align:center;">
            <h2>Добро пожаловать!</h2>
            <p>Вас не было <span id="offline-time"></span></p>
            <h1 style="color:var(--primary);">+<span id="offline-amount">0</span> 🟡</h1>
            <button onclick="collectOffline()">Забрать</button>
        </div>
    </div>

    <!-- Настройки -->
    <div id="modal-settings" class="modal">
        <div style="background:#000; width:90%; height:80vh; overflow-y:auto; border-radius:20px; padding:20px;">
            <div class="acc-head" onclick="this.classList.toggle('open')">👑 Купить PRO <span class="acc-arrow"></span></div><div class="acc-body"><button onclick="openModal('modal-pro')">Открыть</button></div>
            <div class="acc-head" onclick="this.classList.toggle('open')">🎯 Радар <span class="acc-arrow"></span></div><div class="acc-body"><input id="rad"><button onclick="addRadar()">Следить</button></div>
            <div class="acc-head" onclick="this.classList.toggle('open')">🎨 Кастомизация <span class="acc-arrow"></span></div><div class="acc-body">Туман: <input type="range"> Скорость: <input type="range"></div>
        </div>
    </div>

    <!-- Кликер 3D -->
    <div id="tycoon-overlay">
        <h1 id="tycoon-coins">0 🟡</h1>
        <div id="three-earth-container"></div>
        <div class="shop-card"><div><b>Мульти-Тап</b><br><small>+1 за клик</small></div><button onclick="buyItem('multi_tap')">Купить</button></div>
        <button onclick="document.getElementById('tycoon-overlay').classList.remove('active')">Закрыть</button>
    </div>

    <script>
        let tgChatId = "123"; // Замени на инициализацию из Telegram WebApp
        async function init() {
            const res = await fetch(`/api/game/state?user_id=${tgChatId}`);
            const data = await res.json();
            if(data.offline_earned > 0) {
                document.getElementById('offline-amount').innerText = data.offline_earned;
                document.getElementById('modal-offline').style.display = 'flex';
            }
        }
        async function collectOffline() {
            await fetch('/api/game/collect_offline', { method:'POST', body: JSON.stringify({user_id: tgChatId}) });
            document.getElementById('modal-offline').style.display = 'none';
        }
        function openModal(id) { document.getElementById(id).classList.add('active'); }
    </script>
</body>
</html>
