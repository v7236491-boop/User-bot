<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Username Scanner</title>
    <style>
        :root {
            --bg-app: #070b09; /* Очень глубокий темный фон */
            --bg-card: #141A17;
            --bg-card-hover: #1A221E;
            --primary: #29c75f;
            --primary-hover: #22a94f;
            --text-main: #ffffff;
            --text-muted: #829288;
            --border-color: #1E2822;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* --- ЖИВОЙ ФОН: МЕДЛЕННЫЙ РАССЕЯННЫЙ ДЫМ / СИЯНИЕ --- */
        .background-fx {
            position: fixed;
            /* Делаем контейнер огромным, чтобы при вращении не было видно краев */
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none; /* Пропускает клики */
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spinSmoke 60s linear infinite; /* Очень медленное вращение по кругу */
        }

        .smoke {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px); /* Сильное размытие для эффекта дыма */
            opacity: 0.6;
        }

        .smoke-1 { 
            width: 80vw; height: 80vw; 
            background: rgba(41, 199, 95, 0.08); 
            transform: translate(-20%, -30%); 
            animation: pulseSmoke 15s infinite alternate ease-in-out; 
        }
        .smoke-2 { 
            width: 90vw; height: 70vw; 
            background: rgba(22, 163, 74, 0.06); 
            transform: translate(30%, 20%); 
            animation: pulseSmoke 20s infinite alternate-reverse ease-in-out; 
        }
        .smoke-3 { 
            width: 70vw; height: 100vw; 
            background: rgba(5, 150, 105, 0.07); 
            transform: translate(10%, -40%); 
            animation: pulseSmoke 25s infinite alternate ease-in-out; 
        }

        @keyframes spinSmoke {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseSmoke {
            0% { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 0.8; transform: scale(1.1) translate(5%, 5%); }
        }

        /* --- НАВИГАЦИЯ --- */
        header {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            z-index: 50;
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            position: relative;
            z-index: 51;
        }

        .nav-btn:hover { color: var(--primary); }

        /* --- ГЛАВНЫЙ ЭКРАН --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
            position: relative;
            transform: translateY(-8vh);
        }

        .app-container {
            width: 100%;
            max-width: 320px; /* УЖЕ И КОМПАКТНЕЕ (Было 400px) */
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Переключатель платформ */
        .platform-toggle {
            display: flex;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 4px;
            border: 1px solid var(--border-color);
        }

        .platform-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .platform-btn.active {
            background: rgba(41, 199, 95, 0.1);
            color: var(--primary);
        }

        /* Индикатор автопарсера */
        .auto-indicator {
            display: none;
            text-align: center;
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: 500;
            animation: pulseText 1.5s infinite alternate;
            margin-bottom: -5px;
        }

        @keyframes pulseText {
            0% { opacity: 0.5; text-shadow: none; }
            100% { opacity: 1; text-shadow: 0 0 8px rgba(41, 199, 95, 0.6); }
        }

        /* Центральное поле вывода */
        .result-field {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px 15px; /* Чуть уменьшил внутренние отступы для узкого блока */
            text-align: center;
            min-height: 140px; /* Сделал чуть ниже */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .result-field::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            box-shadow: inset 0 0 0px var(--primary);
            transition: 0.3s;
            pointer-events: none;
        }

        .result-field:hover {
            background: var(--bg-card-hover);
            border-color: rgba(41, 199, 95, 0.6);
            box-shadow: 0 10px 35px rgba(41, 199, 95, 0.15);
        }
        
        .result-field:hover::before {
            box-shadow: inset 0 0 25px rgba(41, 199, 95, 0.1);
        }

        .auto-glow-effect {
            border-color: var(--primary) !important;
            animation: autoPulseBox 1.5s infinite alternate;
        }

        @keyframes autoPulseBox {
            0% { box-shadow: 0 0 10px rgba(41, 199, 95, 0.2); }
            100% { box-shadow: 0 0 30px rgba(41, 199, 95, 0.6); }
        }

        .username-text {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            color: var(--text-muted);
            word-break: break-all;
            transition: color 0.3s;
        }

        .rank-badge {
            font-size: 0.9rem;
            font-weight: 700;
            padding: 6px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            margin-bottom: 6px;
        }

        .price-text {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        /* Кнопка генерации */
        .btn-generate {
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-generate:active { transform: scale(0.97); }
        .btn-generate:hover:not(:disabled) { background: var(--primary-hover); }
        
        .btn-generate:disabled {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            cursor: not-allowed;
        }

        /* --- МОДАЛЬНЫЕ ОКНА --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(9, 14, 11, 0.9);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--bg-app);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title { margin: 0; font-size: 1.2rem; font-weight: 600; }

        .btn-close {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn-close:hover { color: #fff; background: var(--border-color); }

        .modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
        }

        /* Настройки (Тумблеры и Фильтры) */
        .setting-item {
            background: var(--bg-card);
            padding: 16px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
        }

        .setting-info { display: flex; flex-direction: column; gap: 4px; }
        .setting-title { font-weight: 600; font-size: 1rem; }
        .setting-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.3; }

        .switch { position: relative; display: inline-block; width: 48px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #1a221e; border: 1px solid var(--border-color); border-radius: 34px; transition: .3s; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: var(--text-muted); border-radius: 50%; transition: .3s; }
        
        input:checked + .slider { background-color: rgba(41, 199, 95, 0.15); border-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(22px); background-color: var(--primary); }

        /* Выпадающее меню фильтров */
        .filter-options {
            display: none;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-top: -6px;
            margin-bottom: 12px;
        }
        
        .filter-options.active { display: block; }
        .filter-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .filter-row:last-child { margin-bottom: 0; }
        
        select { 
            background: var(--bg-card); 
            color: var(--text-main); 
            border: 1px solid var(--border-color); 
            padding: 8px; 
            border-radius: 8px; 
            outline: none; 
            font-family: inherit;
        }

        /* История */
        .history-list { display: flex; flex-direction: column; gap: 12px; }
        
        .history-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }

        .history-card:hover { border-color: var(--primary); background: var(--bg-card-hover); }

        .hist-left { display: flex; flex-direction: column; gap: 4px; }
        .hist-right { text-align: right; }

        .hist-user { font-size: 1.1rem; font-weight: 700; }
        .hist-plat { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
        .hist-rank { font-weight: 700; font-size: 0.9rem; }

        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 0.95rem; }

        /* Тост копирования */
        .toast {
            position: absolute;
            inset: 0;
            background: var(--primary);
            color: #000;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 5;
        }
        .toast.show { opacity: 1; }

    </style>
</head>
<body>

    <!-- Живой фон (Северное сияние / Дым) -->
    <div class="background-fx" id="bg-fx">
        <div class="smoke smoke-1"></div>
        <div class="smoke smoke-2"></div>
        <div class="smoke smoke-3"></div>
    </div>

    <!-- Шапка -->
    <header>
        <button class="nav-btn" onclick="openModal('modal-history')">🗂 История</button>
        <button class="nav-btn" onclick="openModal('modal-settings')">⚙️ Настройки</button>
    </header>

    <!-- Основной контент -->
    <main>
        <div class="app-container">
            
            <div class="platform-toggle">
                <button class="platform-btn active" onclick="setPlatform('telegram', this)">Telegram</button>
                <button class="platform-btn" onclick="setPlatform('whatsapp', this)">WhatsApp</button>
            </div>

            <div id="auto-indicator" class="auto-indicator">Автопарсер активен...</div>

            <div class="result-field" id="result-box">
                <div class="username-text" id="res-username">@username</div>
                <div class="rank-badge" id="res-rank" style="color: var(--text-muted); display: none;">-</div>
                <div class="price-text" id="res-status" style="color: var(--text-muted);">Нажмите сгенерировать</div>
            </div>

            <button class="btn-generate" id="btn-generate" onclick="manualGenerate()">Сгенерировать</button>
            
        </div>
    </main>

    <!-- Модалка: Настройки -->
    <div class="modal-overlay" id="modal-settings">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Настройки</h2>
                <button class="btn-close" onclick="closeModal('modal-settings')">✕</button>
            </div>
            <div class="modal-body">
                
                <div class="setting-item">
                    <div class="setting-info">
                        <span class="setting-title">Автопарсер</span>
                        <span class="setting-desc">Фоновый перебор свободных ников</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle-auto" onchange="toggleAutoSearch(this)">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setting-item">
                    <div class="setting-info">
                        <span class="setting-title">Смарт-фильтр</span>
                        <span class="setting-desc">Генерация коротких ников (2000+ вариантов)</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle-filter" onchange="toggleFilterMenu(this)">
                        <span class="slider"></span>
                    </label>
                </div>

                <!-- Выпадающее меню фильтров (активируется тумблером) -->
                <div class="filter-options" id="filter-menu">
                    <div class="filter-row">
                        <span style="font-size: 0.9rem; color: var(--text-main);">Длина слова</span>
                        <select id="filter-len">
                            <option value="5-6">5-6 символов</option>
                            <option value="7-8">7-8 символов</option>
                        </select>
                    </div>
                    <div class="filter-row">
                        <span style="font-size: 0.9rem; color: var(--text-main);">Добавить цифры</span>
                        <label class="switch"><input type="checkbox" id="filter-num"><span class="slider"></span></label>
                    </div>
                    <div class="filter-row">
                        <span style="font-size: 0.9rem; color: var(--text-main);">Разрешить "_"</span>
                        <label class="switch"><input type="checkbox" id="filter-und"><span class="slider"></span></label>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Модалка: История -->
    <div class="modal-overlay" id="modal-history">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">История</h2>
                <button class="btn-close" onclick="closeModal('modal-history')">✕</button>
            </div>
            <div class="modal-body">
                <div class="history-list" id="history-container">
                    <!-- Данные JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPlatform = 'telegram';
        let isAuto = false;
        let isFetching = false;
        let historyData = JSON.parse(localStorage.getItem('vpn_parser_history')) || [];
        
        const weights = { "SSS+": 100, "SS": 80, "S": 60, "A": 40, "B": 20, "ERR": -1, "F": -10 };

        function setPlatform(platform, btn) {
            if (isAuto) return; 
            currentPlatform = platform;
            document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function openModal(id) {
            const modal = document.getElementById(id);
            modal.classList.add('active');
            if(id === 'modal-history') renderHistory();
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('active');
        }

        function toggleFilterMenu(cb) {
            const menu = document.getElementById('filter-menu');
            if (cb.checked) {
                menu.classList.add('active');
            } else {
                menu.classList.remove('active');
            }
        }

        function toggleAutoSearch(cb) {
            isAuto = cb.checked;
            const btn = document.getElementById('btn-generate');
            const ind = document.getElementById('auto-indicator');
            const box = document.getElementById('result-box');
            
            if (isAuto) {
                btn.disabled = true;
                btn.textContent = "Поиск...";
                ind.style.display = 'block';
                box.classList.add('auto-glow-effect');
                runCycle();
            } else {
                btn.disabled = false;
                btn.textContent = "Сгенерировать";
                ind.style.display = 'none';
                box.classList.remove('auto-glow-effect');
            }
        }

        async function runCycle() {
            if (!isAuto) return;
            if (!isFetching) await fetchUsername();
            if (isAuto) setTimeout(runCycle, 2200);
        }

        async function manualGenerate() {
            if (isFetching || isAuto) return;
            const btn = document.getElementById('btn-generate');
            btn.disabled = true;
            btn.textContent = "Генерация...";
            await fetchUsername();
            btn.textContent = "Сгенерировать";
            btn.disabled = false;
        }

        async function fetchUsername() {
            isFetching = true;
            
            // Получение параметров фильтра
            const useFilter = document.getElementById('toggle-filter').checked;
            const lenMode = document.getElementById('filter-len').value;
            const useNum = document.getElementById('filter-num').checked;
            const useUnd = document.getElementById('filter-und').checked;

            // Формирование URL для main.py
            const url = `/api/generate?platform=${currentPlatform}&use_filter=${useFilter}&len_mode=${lenMode}&use_num=${useNum}&use_und=${useUnd}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                const uEl = document.getElementById('res-username');
                const rEl = document.getElementById('res-rank');
                const sEl = document.getElementById('res-status');

                uEl.textContent = `@${data.generated_username}`;
                uEl.style.color = data.evaluation.color;
                
                rEl.style.display = 'inline-block';
                rEl.textContent = data.evaluation.rank;
                rEl.style.color = data.evaluation.color;
                
                sEl.textContent = data.evaluation.status;
                sEl.style.color = data.evaluation.color;

                if (data.is_free === true && data.evaluation.rank !== "ERR") {
                    saveToHistory({
                        user: data.generated_username,
                        plat: currentPlatform,
                        rank: data.evaluation.rank,
                        price: data.evaluation.status,
                        color: data.evaluation.color
                    });
                }
            } catch (e) {
                console.log(e);
            } finally {
                isFetching = false;
            }
        }

        function saveToHistory(item) {
            if (historyData.some(i => i.user === item.user && i.plat === item.plat)) return;
            historyData.push(item);
            historyData.sort((a, b) => (weights[b.rank] || 0) - (weights[a.rank] || 0));
            localStorage.setItem('vpn_parser_history', JSON.stringify(historyData));
        }

        function copyText(text, cardElement) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = cardElement.querySelector('.toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1200);
            });
        }

        function renderHistory() {
            const cont = document.getElementById('history-container');
            cont.innerHTML = '';
            
            if (historyData.length === 0) {
                cont.innerHTML = '<div class="empty-state">История пуста.<br>Найденные ники сохранятся здесь навсегда.</div>';
                return;
            }
            
            historyData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-card';
                div.onclick = () => copyText(item.user, div);
                
                div.innerHTML = `
                    <div class="hist-left">
                        <div class="hist-user" style="color: ${item.color}">@${item.user}</div>
                        <div class="hist-plat">${item.plat}</div>
                    </div>
                    <div class="hist-right">
                        <div class="hist-rank" style="color: ${item.color}">${item.rank}</div>
                        <div class="price-text" style="color: var(--text-muted)">${item.price}</div>
                    </div>
                    <div class="toast">Скопировано!</div>
                `;
                cont.appendChild(div);
            });
        }
    </script>
</body>
</html>
