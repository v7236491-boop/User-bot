<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Username Scanner</title>
    <style>
        :root {
            --bg-app: #050a07;
            --bg-card: rgba(15, 22, 18, 0.85);
            --primary: #29c75f;
            --primary-hover: #22a94f;
            --text-main: #ffffff;
            --text-muted: #829288;
            --border-color: rgba(41, 199, 95, 0.2);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-app);
            /* ФОН-КАРТИНКА: Загрузи bg.jpg в свой GitHub, и он появится здесь! */
            background-image: url('bg.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Затемнение и неоновое сияние поверх картинки */
        .overlay-fx {
            position: fixed;
            inset: 0;
            background: rgba(4, 8, 5, 0.85); /* Затемняет картинку, чтобы текст читался */
            z-index: -1;
        }
        .glow-fx {
            position: fixed;
            top: 30%; left: 50%;
            transform: translate(-50%, -50%);
            width: 70vw; height: 70vw;
            max-width: 600px; max-height: 600px;
            background: radial-gradient(circle, rgba(41, 199, 95, 0.15) 0%, transparent 60%);
            filter: blur(50px);
            z-index: -1;
        }

        /* --- НАВИГАЦИЯ --- */
        header {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        .nav-btn {
            background: rgba(15, 22, 18, 0.7);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            padding: 10px 16px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            transition: 0.2s;
        }
        .nav-btn:hover { border-color: var(--primary); box-shadow: 0 0 10px rgba(41, 199, 95, 0.2); }

        /* --- ГЛАВНЫЙ ЭКРАН (Сдвинут вверх) --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
            transform: translateY(-8vh); /* Сдвигает весь блок выше центра */
        }

        .app-container { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 14px; }

        .platform-toggle {
            display: flex; background: var(--bg-card); border-radius: 14px; padding: 4px; border: 1px solid var(--border-color); backdrop-filter: blur(10px);
        }
        .platform-btn {
            flex: 1; padding: 12px; background: transparent; border: none; color: var(--text-muted); border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .platform-btn.active { background: rgba(41, 199, 95, 0.15); color: var(--primary); }

        /* Поле вывода */
        .result-field {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(15px);
            transition: 0.3s;
            position: relative;
        }
        .result-field:hover { border-color: rgba(41, 199, 95, 0.5); box-shadow: 0 10px 30px rgba(41, 199, 95, 0.1); }
        
        .username-text { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; color: var(--text-muted); word-break: break-all; }
        .rank-badge { font-size: 0.85rem; font-weight: 700; padding: 4px 10px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 4px; display: none; }
        .price-text { font-size: 0.85rem; opacity: 0.8; }

        /* Кнопка */
        .btn-generate {
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            box-shadow: 0 4px 15px rgba(41, 199, 95, 0.2);
        }
        .btn-generate:active { transform: scale(0.97); }
        .btn-generate:hover:not(:disabled) { background: var(--primary-hover); box-shadow: 0 6px 20px rgba(41, 199, 95, 0.4); }
        .btn-generate:disabled { background: rgba(20, 30, 25, 0.8); color: var(--text-muted); border: 1px solid var(--border-color); box-shadow: none; cursor: not-allowed; }

        /* Индикатор автопарсера */
        .auto-glow-effect {
            animation: autoPulse 1.5s infinite alternate;
            border-color: var(--primary) !important;
        }
        @keyframes autoPulse {
            0% { box-shadow: 0 0 10px rgba(41, 199, 95, 0.2); }
            100% { box-shadow: 0 0 30px rgba(41, 199, 95, 0.6); }
        }
        .auto-label { display: none; text-align: center; color: var(--primary); font-weight: 600; font-size: 0.9rem; margin-bottom: -5px; }

        /* --- МОДАЛЬНЫЕ ОКНА --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(5, 10, 7, 0.9); backdrop-filter: blur(8px); z-index: 100;
            display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; padding: 20px;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content {
            background: #090e0b; border: 1px solid var(--border-color); border-radius: 20px; width: 100%; max-width: 400px; max-height: 85vh; display: flex; flex-direction: column;
        }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .modal-title { margin: 0; font-size: 1.2rem; }
        .btn-close { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }
        .btn-close:hover { color: #fff; }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }

        /* Настройки и Фильтры */
        .setting-item { background: var(--bg-card); padding: 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); margin-bottom: 10px; }
        .setting-info { display: flex; flex-direction: column; gap: 4px; }
        .setting-title { font-weight: 600; font-size: 0.95rem; }
        .setting-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.3; }

        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #1a221e; border: 1px solid var(--border-color); border-radius: 34px; transition: .3s; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: var(--text-muted); border-radius: 50%; transition: .3s; }
        input:checked + .slider { background-color: rgba(41, 199, 95, 0.2); border-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); background-color: var(--primary); }

        .filter-options {
            display: none; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; margin-bottom: 10px;
        }
        .filter-options.active { display: block; }
        .filter-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .filter-row:last-child { margin-bottom: 0; }
        select { background: #111; color: #fff; border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 6px; outline: none; }

        /* История */
        .history-list { display: flex; flex-direction: column; gap: 10px; }
        .history-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; position: relative; }
        .history-card:hover { border-color: var(--primary); }
        .hist-user { font-size: 1.05rem; font-weight: 700; }
        .hist-plat { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .hist-rank { font-weight: 700; font-size: 0.85rem; text-align: right; }
        .toast { position: absolute; inset: 0; background: var(--primary); color: #000; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-weight: 700; opacity: 0; pointer-events: none; transition: 0.2s; }
        .toast.show { opacity: 1; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 30px 0; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="overlay-fx"></div>
    <div class="glow-fx"></div>

    <header>
        <button class="nav-btn" onclick="openModal('modal-history')">🗂 История</button>
        <button class="nav-btn" onclick="openModal('modal-settings')">⚙️ Настройки</button>
    </header>

    <main>
        <div class="app-container">
            
            <div class="platform-toggle">
                <button class="platform-btn active" onclick="setPlatform('telegram', this)">Telegram</button>
                <button class="platform-btn" onclick="setPlatform('whatsapp', this)">WhatsApp</button>
            </div>

            <div id="auto-label" class="auto-label">✦ АВТОПАРСЕР АКТИВЕН ✦</div>

            <div class="result-field" id="result-box">
                <div class="username-text" id="res-username">@username</div>
                <div class="rank-badge" id="res-rank">-</div>
                <div class="price-text" id="res-status">Нажми сгенерировать</div>
            </div>

            <button class="btn-generate" id="btn-generate" onclick="manualGenerate()">Сгенерировать</button>
            
        </div>
    </main>

    <!-- Настройки -->
    <div class="modal-overlay" id="modal-settings">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Настройки</h2>
                <button class="btn-close" onclick="closeModal('modal-settings')">✕</button>
            </div>
            <div class="modal-body">
                
                <div class="setting-item">
                    <div class="setting-info">
                        <span class="setting-title">Автопарсер</span>
                        <span class="setting-desc">Фоновый перебор свободных ников</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle-auto" onchange="toggleAutoSearch(this)">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setting-item">
                    <div class="setting-info">
                        <span class="setting-title">Смарт-фильтр</span>
                        <span class="setting-desc">Генерация красивых коротких слов (L5-L7)</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggle-filter" onchange="toggleFilterMenu(this)">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="filter-options" id="filter-menu">
                    <div class="filter-row">
                        <span style="font-size: 0.9rem;">Длина слова</span>
                        <select id="filter-len">
                            <option value="5-6">5-6 символов</option>
                            <option value="7-8">7-8 символов</option>
                        </select>
                    </div>
                    <div class="filter-row">
                        <span style="font-size: 0.9rem;">Добавить цифры</span>
                        <label class="switch"><input type="checkbox" id="filter-num"><span class="slider"></span></label>
                    </div>
                    <div class="filter-row">
                        <span style="font-size: 0.9rem;">Разрешить "_"</span>
                        <label class="switch"><input type="checkbox" id="filter-und"><span class="slider"></span></label>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- История -->
    <div class="modal-overlay" id="modal-history">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">История улова</h2>
                <button class="btn-close" onclick="closeModal('modal-history')">✕</button>
            </div>
            <div class="modal-body">
                <div class="history-list" id="history-container"></div>
            </div>
        </div>
    </div>

    <script>
        let currentPlatform = 'telegram';
        let isAuto = false;
        let isFetching = false;
        let historyData = JSON.parse(localStorage.getItem('vpn_parser_history')) || [];
        const weights = { "SSS+": 100, "SS": 80, "S": 60, "A": 40, "B": 20, "ERR": -1, "F": -10 };

        function setPlatform(platform, btn) {
            if (isAuto) return; 
            currentPlatform = platform;
            document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); if(id === 'modal-history') renderHistory(); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function toggleFilterMenu(cb) {
            const menu = document.getElementById('filter-menu');
            cb.checked ? menu.classList.add('active') : menu.classList.remove('active');
        }

        function toggleAutoSearch(cb) {
            isAuto = cb.checked;
            const btn = document.getElementById('btn-generate');
            const box = document.getElementById('result-box');
            const lbl = document.getElementById('auto-label');
            
            if (isAuto) {
                btn.disabled = true;
                btn.textContent = "Поиск...";
                box.classList.add('auto-glow-effect');
                lbl.style.display = 'block';
                runCycle();
            } else {
                btn.disabled = false;
                btn.textContent = "Сгенерировать";
                box.classList.remove('auto-glow-effect');
                lbl.style.display = 'none';
            }
        }

        async function runCycle() {
            if (!isAuto) return;
            if (!isFetching) await fetchUsername();
            if (isAuto) setTimeout(runCycle, 2500);
        }

        async function manualGenerate() {
            if (isFetching || isAuto) return;
            const btn = document.getElementById('btn-generate');
            btn.disabled = true;
            btn.textContent = "Генерация...";
            await fetchUsername();
            btn.textContent = "Сгенерировать";
            btn.disabled = false;
        }

        async function fetchUsername() {
            isFetching = true;
            
            // Считываем фильтры
            const useFilter = document.getElementById('toggle-filter').checked;
            const lenMode = document.getElementById('filter-len').value;
            const useNum = document.getElementById('filter-num').checked;
            const useUnd = document.getElementById('filter-und').checked;

            const url = `/api/generate?platform=${currentPlatform}&use_filter=${useFilter}&len_mode=${lenMode}&use_num=${useNum}&use_und=${useUnd}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                const uEl = document.getElementById('res-username');
                const rEl = document.getElementById('res-rank');
                const sEl = document.getElementById('res-status');

                uEl.textContent = `@${data.generated_username}`;
                uEl.style.color = data.evaluation.color;
                
                rEl.style.display = 'inline-block';
                rEl.textContent = data.evaluation.rank;
                rEl.style.color = data.evaluation.color;
                
                sEl.textContent = data.evaluation.status;
                sEl.style.color = data.evaluation.color;

                if (data.is_free === true && data.evaluation.rank !== "ERR") {
                    saveToHistory({
                        user: data.generated_username, plat: currentPlatform,
                        rank: data.evaluation.rank, price: data.evaluation.status, color: data.evaluation.color
                    });
                }
            } catch (e) {
                console.log(e);
            } finally {
                isFetching = false;
            }
        }

        function saveToHistory(item) {
            if (historyData.some(i => i.user === item.user && i.plat === item.plat)) return;
            historyData.push(item);
            historyData.sort((a, b) => (weights[b.rank] || 0) - (weights[a.rank] || 0));
            localStorage.setItem('vpn_parser_history', JSON.stringify(historyData));
        }

        function copyText(text, cardElement) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = cardElement.querySelector('.toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1200);
            });
        }

        function renderHistory() {
            const cont = document.getElementById('history-container');
            cont.innerHTML = '';
            if (historyData.length === 0) {
                cont.innerHTML = '<div class="empty-state">История пуста.<br>Найденные ники сохранятся здесь навсегда.</div>';
                return;
            }
            historyData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-card';
                div.onclick = () => copyText(item.user, div);
                div.innerHTML = `
                    <div><div class="hist-user" style="color: ${item.color}">@${item.user}</div><div class="hist-plat">${item.plat}</div></div>
                    <div class="hist-rank" style="color: ${item.color}">${item.rank}<br><span style="color:#829288; font-size:0.75rem; font-weight:normal">${item.price}</span></div>
                    <div class="toast">Скопировано!</div>
                `;
                cont.appendChild(div);
            });
        }
    </script>
</body>
</html>
