<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Username Scanner</title>
    <style>
        :root {
            --bg-base: #020603;
            --surface: rgba(10, 20, 15, 0.65);
            --border: rgba(34, 197, 94, 0.2);
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }
        
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 1. Современный рассеянный неон на фоне */
        .neon-glow-1 {
            position: absolute;
            top: -10%; left: -10%;
            width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
            filter: blur(80px);
            z-index: -2;
            animation: float 15s ease-in-out infinite alternate;
        }
        
        .neon-glow-2 {
            position: absolute;
            bottom: -20%; right: -10%;
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(5, 150, 105, 0.1) 0%, transparent 60%);
            filter: blur(100px);
            z-index: -2;
            animation: float 20s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 30px); }
        }

        /* 2. Текстура листьев на фоне (тонкий SVG паттерн) */
        .leaf-pattern {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5C30 5 45 10 45 25C45 40 30 55 30 55C30 55 15 40 15 25C15 10 30 5 30 5Z' fill='none' stroke='%2322c55e' stroke-width='0.5' stroke-opacity='0.15'/%3E%3C/svg%3E");
            background-size: 100px 100px;
            z-index: -1;
            pointer-events: none;
        }

        /* Навигация */
        header {
            display: flex;
            justify-content: space-between;
            padding: 24px;
            z-index: 10;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .nav-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(12px);
        }

        .nav-btn:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
        }

        /* Главный экран */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
        }

        .main-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Выбор платформы */
        .platform-selector {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 5px;
            display: flex;
            backdrop-filter: blur(10px);
        }

        .platform-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
        }

        .platform-btn.active {
            background: rgba(34, 197, 94, 0.15);
            color: var(--accent);
            box-shadow: inset 0 0 10px rgba(34, 197, 94, 0.1);
        }

        /* Индикатор автопарсера */
        .auto-indicator {
            display: none;
            text-align: center;
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            animation: pulseText 2s infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; text-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }
        }

        /* Поле вывода юзернейма */
        .input-glow-box {
            background: rgba(5, 10, 7, 0.8);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.05);
            transition: all 0.4s ease;
        }

        .input-glow-box:hover {
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.25);
            border-color: rgba(34, 197, 94, 0.6);
        }

        .username-display {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            word-break: break-all;
            margin-bottom: 10px;
            color: var(--text-muted);
        }

        .rank-badge { font-weight: 600; font-size: 0.9rem; }
        .price-display { font-size: 0.85rem; margin-top: 5px; opacity: 0.8; }

        /* Кнопка генерации */
        .generate-btn {
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
        }

        .generate-btn:hover:not(:disabled) {
            background: var(--accent-hover);
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.4);
            transform: translateY(-2px);
        }

        .generate-btn:disabled {
            background: #111;
            color: #555;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Модальные окна */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 3, 0.85);
            backdrop-filter: blur(10px);
            z-index: 50;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: rgba(10, 20, 15, 0.95);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            max-height: 85vh;
            padding: 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(34, 197, 94, 0.05);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .close-btn:hover { background: var(--border); color: #fff; }
        .modal-title { margin: 0 0 20px 0; font-size: 1.3rem; font-weight: 500; }

        /* Настройки (Тумблер) */
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; }
        
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #111; border: 1px solid #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: var(--text-muted); transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: rgba(34, 197, 94, 0.2); border-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(22px); background-color: var(--accent); box-shadow: 0 0 10px var(--accent); }

        /* История */
        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
        }
        
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .history-item {
            background: rgba(5, 10, 7, 0.8);
            border: 1px solid #14281e;
            padding: 16px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }
        
        .history-item:hover {
            border-color: var(--accent);
            background: rgba(34, 197, 94, 0.05);
        }

        .history-item-left { display: flex; flex-direction: column; gap: 5px; }
        .history-item-right { text-align: right; }
        
        .history-name { font-weight: 600; font-size: 1.1rem; }
        .history-platform { font-size: 0.75rem; color: #555; text-transform: uppercase; letter-spacing: 1px; }
        .history-price { font-size: 0.8rem; color: var(--text-muted); }

        /* Анимация копирования */
        .copy-toast {
            position: absolute;
            inset: 0;
            background: rgba(34, 197, 94, 0.9);
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .copy-toast.show { opacity: 1; }

        .empty-history { text-align: center; color: #555; padding: 40px 20px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- Фоны -->
    <div class="neon-glow-1"></div>
    <div class="neon-glow-2"></div>
    <div class="leaf-pattern"></div>

    <header>
        <button class="nav-btn" onclick="openModal('history-modal')">🗂 History</button>
        <button class="nav-btn" onclick="openModal('settings-modal')">⚙️ Settings</button>
    </header>

    <main>
        <div class="main-container">
            
            <div class="platform-selector">
                <button class="platform-btn active" onclick="setPlatform('telegram', this)">Telegram</button>
                <button class="platform-btn" onclick="setPlatform('whatsapp', this)">WhatsApp</button>
            </div>

            <div id="auto-indicator" class="auto-indicator">
                ✦ Автопарсер работает...
            </div>

            <div class="input-glow-box" id="result-box">
                <div class="username-display" id="res-username">@username</div>
                <div id="res-rank" class="rank-badge" style="color: #555;">Ожидание...</div>
                <div id="res-status" class="price-display"></div>
            </div>

            <button id="generate-btn" class="generate-btn" onclick="manualGenerate()">Сгенерировать</button>
            
        </div>
    </main>

    <!-- Модальное окно Настроек -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('settings-modal')">✕</button>
            <h2 class="modal-title">Настройки</h2>
            
            <div class="setting-row">
                <div>
                    <div style="font-size: 1.1rem; color: #fff;">Автопарсер</div>
                    <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Фоновый перебор никнеймов</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="auto-search-toggle" onchange="toggleAutoSearch(this)">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <!-- Модальное окно Истории -->
    <div id="history-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('history-modal')">✕</button>
            <h2 class="modal-title">История улова</h2>
            <div id="history-container" class="history-list"></div>
        </div>
    </div>

    <script>
        let currentPlatform = 'telegram';
        let isAutoSearching = false;
        let isFetching = false;
        let historyData = JSON.parse(localStorage.getItem('catch_history')) || [];
        
        const rankWeights = { "SSS+": 100, "SS": 80, "S": 60, "A": 40, "B": 20, "ERR": -1, "F": -10 };

        function setPlatform(platform, btnElement) {
            if (isAutoSearching) return; // Блокировка смены при автопоиске
            currentPlatform = platform;
            document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
        }

        function openModal(id) {
            document.getElementById(id).classList.add('active');
            if(id === 'history-modal') renderHistory();
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function toggleAutoSearch(checkbox) {
            isAutoSearching = checkbox.checked;
            const btn = document.getElementById('generate-btn');
            const indicator = document.getElementById('auto-indicator');
            
            if (isAutoSearching) {
                btn.disabled = true;
                indicator.style.display = 'block';
                runAutoSearchCycle();
            } else {
                btn.disabled = false;
                indicator.style.display = 'none';
            }
        }

        async function runAutoSearchCycle() {
            if (!isAutoSearching) return;
            if (!isFetching) await fetchAndProcessUsername();
            if (isAutoSearching) setTimeout(runAutoSearchCycle, 2200);
        }

        async function manualGenerate() {
            if (isFetching || isAutoSearching) return;
            const btn = document.getElementById('generate-btn');
            btn.disabled = true;
            btn.textContent = "Поиск...";
            await fetchAndProcessUsername();
            btn.textContent = "Сгенерировать";
            btn.disabled = false;
        }

        async function fetchAndProcessUsername() {
            isFetching = true;
            
            try {
                const response = await fetch(`/api/generate?platform=${currentPlatform}`);
                const data = await response.json();
                
                const userEl = document.getElementById('res-username');
                userEl.textContent = `@${data.generated_username}`;
                userEl.style.color = data.evaluation.color;
                
                const rankEl = document.getElementById('res-rank');
                rankEl.textContent = data.evaluation.rank;
                rankEl.style.color = data.evaluation.color;
                
                const statusEl = document.getElementById('res-status');
                statusEl.textContent = data.evaluation.status;
                statusEl.style.color = data.evaluation.color;

                if (data.is_free === true && data.evaluation.rank !== "ERR") {
                    addToHistory({
                        username: data.generated_username,
                        platform: currentPlatform,
                        rank: data.evaluation.rank,
                        price: data.evaluation.status,
                        color: data.evaluation.color
                    });
                }
            } catch (err) {
                console.error("Ошибка:", err);
            } finally {
                isFetching = false;
            }
        }

        function addToHistory(item) {
            if (historyData.some(i => i.username === item.username && i.platform === item.platform)) return;
            historyData.push(item);
            historyData.sort((a, b) => (rankWeights[b.rank] || 0) - (rankWeights[a.rank] || 0));
            localStorage.setItem('catch_history', JSON.stringify(historyData));
        }

        function copyUsername(username, element) {
            navigator.clipboard.writeText(username).then(() => {
                const toast = element.querySelector('.copy-toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1200);
            });
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            container.innerHTML = '';
            
            if (historyData.length === 0) {
                container.innerHTML = '<div class="empty-history">История пуста.<br>Найденные свободные ники сохранятся здесь.</div>';
                return;
            }
            
            historyData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.onclick = () => copyUsername(item.username, div);
                
                div.innerHTML = `
                    <div class="history-item-left">
                        <div class="history-name" style="color: ${item.color}">@${item.username}</div>
                        <div class="history-platform">${item.platform}</div>
                    </div>
                    <div class="history-item-right">
                        <div class="history-rank" style="color: ${item.color}">${item.rank}</div>
                        <div class="history-price">${item.price}</div>
                    </div>
                    <div class="copy-toast">Скопировано!</div>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
